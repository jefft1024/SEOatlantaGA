<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="A rising sessions-to-leads chart">
<title>A rising sessions-to-leads chart</title>
<defs>
  <radialGradient id="sky" cx="72%" cy="4%" r="112%">
    <stop offset="0%" stop-color="#0E2450"/><stop offset="46%" stop-color="#081431"/><stop offset="100%" stop-color="#04081A"/>
  </radialGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0E2A5C"/><stop offset="55%" stop-color="#1B72F0"/><stop offset="100%" stop-color="#4DA3FF"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="rgba(255,255,255,.10)"/><stop offset="100%" stop-color="rgba(255,255,255,.03)"/>
  </linearGradient>
  <linearGradient id="riseFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1B72F0" stop-opacity=".42"/><stop offset="100%" stop-color="#1B72F0" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="mintFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0FBF8F" stop-opacity=".40"/><stop offset="100%" stop-color="#0FBF8F" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#4DA3FF" stop-opacity="0"/><stop offset="50%" stop-color="#4DA3FF" stop-opacity=".55"/><stop offset="100%" stop-color="#4DA3FF" stop-opacity="0"/>
  </linearGradient>
  <pattern id="mesh" width="56" height="56" patternUnits="userSpaceOnUse">
    <path d="M56 0H0v56" fill="none" stroke="rgba(120,168,255,.16)" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  
</defs>
  <rect width="900" height="300" fill="url(#sky)"/>
  <circle cx="700" cy="40" r="190" fill="#1B72F0" opacity="0.34" filter="url(#soft)"/>
  <circle cx="140" cy="290" r="170" fill="#4DA3FF" opacity="0.18" filter="url(#soft)"/>
  <rect width="900" height="300" fill="url(#mesh)" opacity=".85"/>
  <rect width="900" height="300" fill="none" stroke="rgba(120,168,255,.30)" stroke-width="1"/>
  
  <g transform="translate(250,42)">
    <rect width="400" height="184" rx="18" fill="rgba(10,27,66,.72)" stroke="rgba(120,168,255,.30)"/>
    <path d="M22,58 H378" stroke="rgba(120,168,255,.16)" opacity=".6"/><path d="M22,98 H378" stroke="rgba(120,168,255,.16)" opacity=".6"/><path d="M22,138 H378" stroke="rgba(120,168,255,.16)" opacity=".6"/>
    <path d="M36,150 C70,150 70,132 104,132 C138,132 138,138 172,138 C206,138 206,104 240,104 C274,104 274,86 308,86 C337,86 337,46 366,46 L366,168 L36,168 Z" fill="url(#riseFill)"/><path d="M36,150 C70,150 70,132 104,132 C138,132 138,138 172,138 C206,138 206,104 240,104 C274,104 274,86 308,86 C337,86 337,46 366,46" fill="none" stroke="#4DA3FF" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M36,162 C70,162 70,154 104,154 C138,154 138,156 172,156 C206,156 206,138 240,138 C274,138 274,128 308,128 C337,128 337,102 366,102 L366,168 L36,168 Z" fill="url(#mintFill)"/><path d="M36,162 C70,162 70,154 104,154 C138,154 138,156 172,156 C206,156 206,138 240,138 C274,138 274,128 308,128 C337,128 337,102 366,102" fill="none" stroke="#0FBF8F" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <g transform="translate(676,96)">
    <rect width="0" height="0"/>
  </g>
  <text x="668" y="116" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="800" fill="#0FBF8F">▲ 34%</text>
  <text x="668" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#7E93C4">sessions → leads</text>
</svg>
