<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Site crawl tree with blocked pages, alongside Core Web Vitals and index coverage">
<title>Site crawl tree with blocked pages, alongside Core Web Vitals and index coverage</title>
<defs>
  <radialGradient id="sky" cx="72%" cy="4%" r="112%">
    <stop offset="0%" stop-color="#0E2450"/><stop offset="46%" stop-color="#081431"/><stop offset="100%" stop-color="#04081A"/>
  </radialGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0E2A5C"/><stop offset="55%" stop-color="#1B72F0"/><stop offset="100%" stop-color="#4DA3FF"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="rgba(255,255,255,.10)"/><stop offset="100%" stop-color="rgba(255,255,255,.03)"/>
  </linearGradient>
  <linearGradient id="riseFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1B72F0" stop-opacity=".42"/><stop offset="100%" stop-color="#1B72F0" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="mintFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0FBF8F" stop-opacity=".40"/><stop offset="100%" stop-color="#0FBF8F" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#4DA3FF" stop-opacity="0"/><stop offset="50%" stop-color="#4DA3FF" stop-opacity=".55"/><stop offset="100%" stop-color="#4DA3FF" stop-opacity="0"/>
  </linearGradient>
  <pattern id="mesh" width="56" height="56" patternUnits="userSpaceOnUse">
    <path d="M56 0H0v56" fill="none" stroke="rgba(120,168,255,.16)" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  
</defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <circle cx="300" cy="90" r="320" fill="#1B72F0" opacity="0.26" filter="url(#soft)"/>
  <circle cx="1020" cy="660" r="300" fill="#FF7A59" opacity="0.12" filter="url(#soft)"/>
  <rect width="1200" height="750" fill="url(#mesh)" opacity=".85"/>
  <rect width="1200" height="750" fill="none" stroke="rgba(120,168,255,.30)" stroke-width="1"/>
  <text x="64" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#EAF2FF">Crawl → render → index</text>
  <text x="64" y="124" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="500" fill="#7E93C4">Where the pages actually stop.</text>
  <g>
    <path d="M190,150 C310,150 310,225 430,225" fill="none" stroke="rgba(120,168,255,.30)" stroke-width="2"/>
    <path d="M190,300 C310,300 310,225 430,225" fill="none" stroke="rgba(120,168,255,.30)" stroke-width="2"/>
    <path d="M190,450 C310,450 310,375 430,375" fill="none" stroke="rgba(120,168,255,.30)" stroke-width="2"/>
    <path d="M190,600 C310,600 310,525 430,525" fill="none" stroke="rgba(120,168,255,.30)" stroke-width="2"/>
    <path d="M430,225 C535,225 535,300 640,300" fill="none" stroke="rgba(120,168,255,.30)" stroke-width="2"/>
    <path d="M430,375 C535,375 535,300 640,300" fill="none" stroke="rgba(120,168,255,.30)" stroke-width="2"/>
    <path d="M430,375 C535,375 535,450 640,450" fill="none" stroke="rgba(120,168,255,.30)" stroke-width="2"/>
    <path d="M430,525 C535,525 535,450 640,450" fill="none" stroke="rgba(120,168,255,.30)" stroke-width="2"/>
    <g><circle cx="190" cy="150" r="15" fill="#4DA3FF" opacity="0.8" />
      <circle cx="190" cy="150" r="24" fill="none" stroke="#4DA3FF" stroke-width="1.5" opacity=".32"/></g>
    <g><circle cx="190" cy="300" r="15" fill="#4DA3FF" opacity="0.8" />
      <circle cx="190" cy="300" r="24" fill="none" stroke="#4DA3FF" stroke-width="1.5" opacity=".32"/></g>
    <g><circle cx="190" cy="450" r="15" fill="#4DA3FF" opacity="0.8" />
      <circle cx="190" cy="450" r="24" fill="none" stroke="#4DA3FF" stroke-width="1.5" opacity=".32"/></g>
    <g><circle cx="190" cy="600" r="15" fill="#FF7A59" opacity="0.95" filter="url(#glow)"/>
      <circle cx="190" cy="600" r="24" fill="none" stroke="#FF7A59" stroke-width="1.5" opacity=".32"/></g>
    <g><circle cx="430" cy="225" r="15" fill="#4DA3FF" opacity="0.8" />
      <circle cx="430" cy="225" r="24" fill="none" stroke="#4DA3FF" stroke-width="1.5" opacity=".32"/></g>
    <g><circle cx="430" cy="375" r="15" fill="#4DA3FF" opacity="0.8" />
      <circle cx="430" cy="375" r="24" fill="none" stroke="#4DA3FF" stroke-width="1.5" opacity=".32"/></g>
    <g><circle cx="430" cy="525" r="15" fill="#F5A623" opacity="0.95" />
      <circle cx="430" cy="525" r="24" fill="none" stroke="#F5A623" stroke-width="1.5" opacity=".32"/></g>
    <g><circle cx="640" cy="300" r="20" fill="#4DA3FF" opacity="0.8" />
      <circle cx="640" cy="300" r="29" fill="none" stroke="#4DA3FF" stroke-width="1.5" opacity=".32"/></g>
    <g><circle cx="640" cy="450" r="20" fill="#4DA3FF" opacity="0.8" />
      <circle cx="640" cy="450" r="29" fill="none" stroke="#4DA3FF" stroke-width="1.5" opacity=".32"/></g>
    <g transform="translate(214,600)"><g><rect x="0" y="-14" width="68" height="28" rx="14" fill="rgba(255,122,89,.16)" stroke="rgba(255,122,89,.5)"/>
  <text x="34" y="3.96" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#FF7A59" text-anchor="middle">NOINDEX</text></g></g>
    <g transform="translate(454,525)"><g><rect x="0" y="-14" width="68" height="28" rx="14" fill="rgba(245,166,35,.15)" stroke="rgba(245,166,35,.5)"/>
  <text x="34" y="3.96" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#F5A623" text-anchor="middle">DEPTH 5</text></g></g>
  </g>
  <g transform="translate(760,150)">
    <g>
    <rect x="0" y="0" width="380" height="244" rx="20" fill="rgba(12,32,74,.92)" stroke="rgba(120,168,255,.30)" stroke-width="1"/>
    <rect x="0" y="0" width="380" height="44" rx="20" fill="url(#glass)"/>
  </g>
    <text x="28" y="42" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#4DA3FF" letter-spacing="2.2">CORE WEB VITALS</text>
    <path d="M28,58 H352" stroke="rgba(120,168,255,.16)"/>
    <g transform="translate(88,148)">
      <circle r="52" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="11"/>
      <circle r="52" fill="none" stroke="#0FBF8F" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="326.7256359733385" stroke-dashoffset="58.81061447520095" transform="rotate(-90)"/>
      <text x="0" y="4" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#EAF2FF" text-anchor="middle">1.9s</text>
      <text x="0" y="24" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#7E93C4" text-anchor="middle" letter-spacing="1.4">LCP</text>
    </g>
    <g transform="translate(196,148)">
      <circle r="52" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="11"/>
      <circle r="52" fill="none" stroke="#F5A623" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="326.7256359733385" stroke-dashoffset="137.22476710880218" transform="rotate(-90)"/>
      <text x="0" y="4" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#EAF2FF" text-anchor="middle">212ms</text>
      <text x="0" y="24" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#7E93C4" text-anchor="middle" letter-spacing="1.4">INP</text>
    </g>
    <g transform="translate(304,148)">
      <circle r="52" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="11"/>
      <circle r="52" fill="none" stroke="#0FBF8F" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="326.7256359733385" stroke-dashoffset="22.87079451813368" transform="rotate(-90)"/>
      <text x="0" y="4" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#EAF2FF" text-anchor="middle">0.04</text>
      <text x="0" y="24" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#7E93C4" text-anchor="middle" letter-spacing="1.4">CLS</text>
    </g>
  </g>
  <g transform="translate(760,436)">
    <g>
    <rect x="0" y="0" width="380" height="208" rx="20" fill="rgba(12,32,74,.92)" stroke="rgba(120,168,255,.30)" stroke-width="1"/>
    <rect x="0" y="0" width="380" height="44" rx="20" fill="url(#glass)"/>
  </g>
    <text x="28" y="42" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#4DA3FF" letter-spacing="2.2">INDEX COVERAGE</text>
    
    <text x="28" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#AEC2E8">Indexed</text>
    <rect x="28" y="86" width="324" height="9" rx="4.5" fill="rgba(255,255,255,.07)"/>
    <rect x="28" y="86" width="240" height="9" rx="4.5" fill="#0FBF8F"/>
    <text x="352" y="76" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#0FBF8F" text-anchor="end">74%</text>
    <text x="28" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#AEC2E8">Crawled, not indexed</text>
    <rect x="28" y="132" width="324" height="9" rx="4.5" fill="rgba(255,255,255,.07)"/>
    <rect x="28" y="132" width="58" height="9" rx="4.5" fill="#F5A623"/>
    <text x="352" y="122" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#F5A623" text-anchor="end">18%</text>
    <text x="28" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#AEC2E8">Excluded</text>
    <rect x="28" y="178" width="324" height="9" rx="4.5" fill="rgba(255,255,255,.07)"/>
    <rect x="28" y="178" width="26" height="9" rx="4.5" fill="#FF7A59"/>
    <text x="352" y="168" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#FF7A59" text-anchor="end">8%</text>
  </g>
  
</svg>
