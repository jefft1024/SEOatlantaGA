<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-label="Bar chart of click-through rate by search position, and the arithmetic turning it into monthly gross profit">
<title>Bar chart of click-through rate by search position, and the arithmetic turning it into monthly gross profit</title>
<defs>
