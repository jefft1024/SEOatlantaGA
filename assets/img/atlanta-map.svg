<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Stylized map of metro Atlanta with local ranking pins across Buckhead, Midtown and Decatur" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F7FE"/><stop offset="0.55" stop-color="#E7EFFB"/><stop offset="1" stop-color="#DAE7F8"/>
    </linearGradient>
    <linearGradient id="mpin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E8BFF"/><stop offset="1" stop-color="#1B72F0"/>
    </linearGradient>
    <linearGradient id="mhwy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9FC0F5"/><stop offset="1" stop-color="#7FA8EE"/>
    </linearGradient>
    <filter id="msh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0E2A5C" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#mbg)"/>

  <!-- park / greenspace (Piedmont) -->
  <path d="M812 120 q120 20 150 150 q26 120 -70 190 q-90 60 -180 6 q-70 -46 -40 -160 q30 -150 140 -186 z" fill="#DCF0E1" opacity="0.9"/>
  <!-- river / reservoir hint -->
  <path d="M120 40 C210 150 150 240 250 320 C340 392 300 500 230 600 C190 660 210 720 260 760" fill="none" stroke="#CFE0FB" stroke-width="26" stroke-linecap="round" opacity="0.75"/>

  <!-- street grid -->
  <g stroke="#CBDBF2" stroke-width="3">
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="390" x2="1200" y2="390"/><line x1="0" y1="510" x2="1200" y2="510"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="760"/><line x1="380" y1="0" x2="380" y2="760"/>
    <line x1="600" y1="0" x2="600" y2="760"/><line x1="820" y1="0" x2="820" y2="760"/>
    <line x1="1020" y1="0" x2="1020" y2="760"/>
  </g>
  <!-- diagonal avenues (Peachtree) -->
  <g stroke="#C3D6F1" stroke-width="5" opacity="0.8">
    <line x1="120" y1="760" x2="760" y2="0" stroke="#C3D6F1"/>
    <line x1="520" y1="760" x2="1080" y2="120" stroke="#C3D6F1"/>
  </g>

  <!-- highways: the Connector + perimeter arc -->
  <path d="M430 -20 C480 200 470 420 560 620 C600 710 590 760 590 780" fill="none" stroke="url(#mhwy)" stroke-width="16" stroke-linecap="round"/>
  <path d="M40 470 C260 360 520 360 720 470 C900 568 1040 520 1180 430" fill="none" stroke="url(#mhwy)" stroke-width="14" stroke-linecap="round" opacity="0.9"/>

  <!-- neighborhood blocks -->
  <g opacity="0.5">
    <rect x="230" y="200" width="120" height="80" rx="10" fill="#D5E2F6"/>
    <rect x="640" y="470" width="140" height="90" rx="10" fill="#D5E2F6"/>
    <rect x="900" y="220" width="110" height="76" rx="10" fill="#D5E2F6"/>
  </g>

  <!-- coverage ring around the winning pin -->
  <circle cx="560" cy="300" r="150" fill="#1B72F0" opacity="0.06"/>
  <circle cx="560" cy="300" r="150" fill="none" stroke="#4DA3FF" stroke-width="2" stroke-dasharray="4 8" opacity="0.5"/>
  <circle cx="560" cy="300" r="96" fill="#1B72F0" opacity="0.07"/>

  <!-- secondary pin: Buckhead (top) -->
  <g filter="url(#msh)">
    <path d="M330 150 a34 34 0 0 0-34 34 c0 24 34 58 34 58 s34-34 34-58 a34 34 0 0 0-34-34z" fill="#8FB4E8"/>
    <circle cx="330" cy="184" r="13" fill="#fff"/>
  </g>
  <!-- secondary pin: Decatur (right) -->
  <g filter="url(#msh)">
    <path d="M905 470 a34 34 0 0 0-34 34 c0 24 34 58 34 58 s34-34 34-58 a34 34 0 0 0-34-34z" fill="#8FB4E8"/>
    <circle cx="905" cy="504" r="13" fill="#fff"/>
  </g>

  <!-- primary pin: Midtown / #1 -->
  <g filter="url(#msh)">
    <path d="M560 236 a52 52 0 0 0-52 52 c0 36 52 88 52 88 s52-52 52-88 a52 52 0 0 0-52-52z" fill="url(#mpin)"/>
    <circle cx="560" cy="288" r="20" fill="#fff"/>
    <text x="560" y="296" text-anchor="middle" font-size="24" font-weight="700" fill="#1B72F0">1</text>
  </g>

  <!-- labels -->
  <g fill="#33456E" font-weight="600">
    <rect x="286" y="96" width="112" height="30" rx="15" fill="#fff" opacity="0.92"/>
    <text x="342" y="116" text-anchor="middle" font-size="17">Buckhead</text>
    <rect x="503" y="150" width="114" height="30" rx="15" fill="#fff" opacity="0.95"/>
    <text x="560" y="170" text-anchor="middle" font-size="17">Midtown</text>
    <rect x="862" y="416" width="104" height="30" rx="15" fill="#fff" opacity="0.92"/>
    <text x="914" y="436" text-anchor="middle" font-size="17">Decatur</text>
  </g>

  <!-- corner tag -->
  <g>
    <rect x="40" y="676" width="240" height="44" rx="12" fill="#0E2A5C"/>
    <circle cx="70" cy="698" r="7" fill="#0FBF8F"/>
    <text x="90" y="704" font-size="17" fill="#EAF2FF" font-weight="600" letter-spacing="0.5">MAP PACK · METRO ATLANTA</text>
  </g>
</svg>
