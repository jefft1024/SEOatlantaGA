    <rect x="16" y="22" width="98" height="8" rx="4" fill="#AEC2E8" opacity="0.3"/><rect x="16" y="44" width="76" height="8" rx="4" fill="#AEC2E8" opacity="0.3"/><rect x="16" y="66" width="54" height="8" rx="4" fill="#AEC2E8" opacity="0.3"/><rect x="16" y="88" width="98" height="8" rx="4" fill="#AEC2E8" opacity="0.3"/><rect x="16" y="110" width="76" height="8" rx="4" fill="#AEC2E8" opacity="0.3"/>
    
  </g><g transform="translate(544,46)">
    <rect width="130" height="168" rx="14" fill="rgba(10,27,66,.72)" stroke="rgba(120,168,255,.30)"/>
