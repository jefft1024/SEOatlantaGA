<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — SEO Atlanta GA</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{
    --navy:#0B1E42; --navy-2:#0E2A5C; --ink:#0d1b34; --line:#e3e9f5;
    --blue:#1B72F0; --blue-d:#155cc4; --sky:#4DA3FF; --bg:#f5f8ff;
    --muted:#5a6b8c; --good:#12805c; --bad:#cc2233; --warn:#b8860b;
    --shadow:0 6px 24px rgba(13,27,52,.09);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
  a{color:var(--blue)}
  h1,h2,h3{font-family:'Sora',system-ui,sans-serif;margin:0}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--sky);outline-offset:0;border-color:var(--sky)}
  label{display:block;font-weight:600;font-size:13px;margin:0 0 5px;color:#33436b}
  .btn{border:1px solid transparent;border-radius:9px;padding:10px 16px;font-weight:600;font-size:14px;background:var(--blue);color:#fff}
  .btn:hover{background:var(--blue-d)}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--sky)}
  .btn.danger{background:#fff;color:var(--bad);border-color:#f2c9cf}
  .btn.danger:hover{background:#fdecee}
  .btn.sm{padding:6px 11px;font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .pill.published{background:#e6f6ee;color:var(--good)}
  .pill.draft{background:#fdf3e0;color:var(--warn)}
  .pill.new{background:#e7f0ff;color:var(--blue)}
  .pill.read{background:#eef1f6;color:#67789e}
  .pill.archived{background:#f3f4f6;color:#8a93a5}
  .hidden{display:none!important}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#8090b0}

  /* login */
  #login{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(1200px 600px at 50% -10%,#12336e,transparent),var(--navy)}
  #login .card{width:100%;max-width:380px}
  #login .brand{display:flex;gap:9px;align-items:center;justify-content:center;margin-bottom:18px;color:#fff}
  #login .brand b{font-family:'Sora';font-size:19px}

  /* app shell */
  #app{min-height:100vh}
  .top{background:var(--navy);color:#fff;padding:0 22px;position:sticky;top:0;z-index:5}
  .top .inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:18px;height:58px}
  .top .brand{display:flex;gap:8px;align-items:center;font-family:'Sora';font-weight:700}
  .top nav{display:flex;gap:4px;margin-left:12px}
  .top nav button{background:transparent;border:none;color:#b9cdf2;padding:8px 13px;border-radius:8px;font-weight:600;font-size:14px}
  .top nav button.active,.top nav button:hover{background:rgba(255,255,255,.12);color:#fff}
  .top .sp{flex:1}
  .top .who{font-size:13px;color:#b9cdf2}
  .wrap{max-width:1080px;margin:0 auto;padding:26px 22px 80px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .head h1{font-size:22px}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;z-index:20;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .toast.err{background:var(--bad)}

  .editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .preview{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;max-height:70vh;overflow:auto}
  .preview h1,.preview h2,.preview h3{font-family:'Sora';margin:1.1em 0 .4em;line-height:1.25}
  .preview h1{font-size:26px}.preview h2{font-size:20px}.preview h3{font-size:17px}
  .preview p,.preview li{font-size:15px;color:#2b3a5c}
  .preview img{max-width:100%;border-radius:8px}
  .preview table{margin:1em 0}
  .preview code{background:#eef1f8;padding:1px 5px;border-radius:5px;font-size:.9em}
  .preview blockquote{border-left:3px solid var(--sky);margin:1em 0;padding:.3em 0 .3em 14px;color:#3a4a6b}
  textarea.body{min-height:52vh;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13.5px;line-height:1.6}
  .field{margin-bottom:14px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  @media(max-width:800px){.editor-grid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.preview{max-height:none}}
</style>
</head>
<body>

<!-- ── Login ─────────────────────────────────────────────────────────────── -->
<div id="login">
  <form class="card pad" id="loginForm">
    <div class="brand">
      <svg width="30" height="26" viewBox="0 0 52 46" aria-hidden="true"><path d="M3 43 L17 8 L24 22 L15.5 43 Z" fill="#fff"/><path d="M26 43 L31.5 29 L38.5 43 Z" fill="#fff"/><path d="M2 44 C16 37 30 25 41 10" stroke="#4DA3FF" stroke-width="5.5" fill="none" stroke-linecap="round"/><path d="M33 7 L45 5 L43 17 Z" fill="#4DA3FF"/></svg>
      <b>SEO Atlanta GA</b>
    </div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit" style="width:100%">Sign in</button>
    <p class="muted" id="loginMsg" style="margin:12px 0 0;font-size:13px"></p>
  </form>
</div>

<!-- ── App ───────────────────────────────────────────────────────────────── -->
<div id="app" class="hidden">
  <div class="top"><div class="inner">
    <span class="brand">
      <svg width="24" height="21" viewBox="0 0 52 46" aria-hidden="true"><path d="M3 43 L17 8 L24 22 L15.5 43 Z" fill="#fff"/><path d="M26 43 L31.5 29 L38.5 43 Z" fill="#fff"/><path d="M2 44 C16 37 30 25 41 10" stroke="#4DA3FF" stroke-width="5.5" fill="none" stroke-linecap="round"/><path d="M33 7 L45 5 L43 17 Z" fill="#4DA3FF"/></svg>
      Admin
    </span>
    <nav>
      <button data-view="posts" class="active">Posts</button>
      <button data-view="leads">Leads</button>
      <button data-view="settings">Settings</button>
    </nav>
    <span class="sp"></span>
    <a href="/" target="_blank" class="who" style="color:#b9cdf2">View site ↗</a>
    <span class="who" id="whoami"></span>
    <button class="btn ghost sm" id="logout">Log out</button>
  </div></div>

  <!-- Posts list -->
  <div class="wrap view" id="view-posts">
    <div class="head"><h1>Blog posts</h1><button class="btn" id="newPost">+ New post</button></div>
    <div class="card"><div id="postList"></div></div>
  </div>

  <!-- Editor -->
  <div class="wrap view hidden" id="view-editor">
    <div class="head">
      <h1 id="editorTitle">New post</h1>
      <div class="row">
        <button class="btn ghost" id="cancelEdit">← Back</button>
        <button class="btn ghost" id="saveDraft">Save draft</button>
        <button class="btn" id="publishPost">Publish</button>
      </div>
    </div>
    <div class="editor-grid">
      <div class="card pad">
        <div class="field"><label for="f-title">Title</label><input id="f-title" placeholder="How to rank in the Atlanta map pack"></div>
        <div class="grid2">
          <div class="field"><label for="f-slug">URL slug</label><input id="f-slug" placeholder="atlanta-map-pack"></div>
          <div class="field"><label for="f-category">Category</label><input id="f-category" placeholder="Local SEO"></div>
        </div>
        <div class="field"><label for="f-excerpt">Excerpt / lede</label><textarea id="f-excerpt" rows="2" placeholder="One or two sentences shown under the title and in listings."></textarea></div>
        <div class="grid2">
          <div class="field"><label for="f-cover">Cover image URL <span class="muted">(optional)</span></label><input id="f-cover" placeholder="https://…"></div>
          <div class="field"><label for="f-read">Read time (minutes)</label><input id="f-read" type="number" min="1" value="5"></div>
        </div>
        <div class="field"><label for="f-body">Body <span class="muted">(Markdown)</span></label><textarea id="f-body" class="body" placeholder="## Start with a question heading&#10;&#10;Answer it in the first sentence, then elaborate.&#10;&#10;- Use lists&#10;- And **bold** for emphasis"></textarea></div>
        <details>
          <summary style="cursor:pointer;font-weight:600;font-size:13px;color:#33436b">SEO overrides (optional)</summary>
          <div class="field" style="margin-top:12px"><label for="f-metatitle">Meta title</label><input id="f-metatitle" placeholder="Defaults to the post title"></div>
          <div class="field"><label for="f-metadesc">Meta description</label><textarea id="f-metadesc" rows="2" placeholder="Defaults to the excerpt"></textarea></div>
        </details>
      </div>
      <div>
        <label>Live preview</label>
        <div class="preview" id="preview"></div>
      </div>
    </div>
  </div>

  <!-- Leads -->
  <div class="wrap view hidden" id="view-leads">
    <div class="head"><h1>Leads</h1><button class="btn ghost sm" id="refreshLeads">Refresh</button></div>
    <div class="card"><div id="leadList"></div></div>
  </div>

  <!-- Settings -->
  <div class="wrap view hidden" id="view-settings">
    <div class="head"><h1>Lead delivery</h1></div>
    <div class="card pad" style="max-width:600px">
      <p class="muted" style="margin-top:0">Where new leads are sent. Leaving a field blank falls back to the environment variable set in Vercel. Email sending also requires <code>RESEND_API_KEY</code> in Vercel.</p>
      <div class="field"><label for="s-to">Send lead emails to</label><input id="s-to" placeholder="you@yourbusiness.com"></div>
      <div class="field"><label for="s-from">From address <span class="muted">(must be a verified Resend sender)</span></label><input id="s-from" placeholder="leads@seoatlantaga.com"></div>
      <div class="field"><label for="s-webhook">Webhook URL <span class="muted">(Zapier / Make / Slack / CRM)</span></label><input id="s-webhook" placeholder="https://hooks.zapier.com/…"></div>
      <button class="btn" id="saveSettings">Save settings</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/assets/js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
